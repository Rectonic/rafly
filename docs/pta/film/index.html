    .muted-unit { fill: #DDE3E1; stroke: #87938F; stroke-width: 5; }
    .tick { fill: none; stroke: var(--paper); stroke-width: 9; stroke-linecap: square; stroke-linejoin: miter; }

    #startOverlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(244, 246, 245, .975);

        <!-- One static texture tile over the stage. It is never redrawn per frame. -->
        <rect id="textureLayer" width="1920" height="922" fill="url(#paperGrain)" opacity=".12" pointer-events="none"/>

        <!-- Single non-competing narrative line. Its content and hold are clock-driven. -->
        <g id="captionLayer" pointer-events="none">

      <output id="debugReadout" aria-live="off"></output>
    </main>
  </div>

  <script>
    (() => {
      'use strict';

      const SCENES = Object.freeze([
        { id: 'title',     name: 'Титул',                 start:     0, duration:  4000 },
        { id: 'shop',      name: 'Магазин вечером',       start:  4000, duration:  9000 },
        { id: 'unknown',   name: 'Незнание',              start: 13000, duration:  9000 },
        { id: 'import',    name: 'Импорт каталога',       start: 22000, duration: 11000 },
        { id: 'human',     name: 'Человек решает',        start: 33000, duration:  7000 },
        { id: 'recount',   name: 'Пересчёт',              start: 40000, duration:  7000 },
        { id: 'expiry',    name: 'Вахта просрочки',       start: 47000, duration:  9000 },
        { id: 'offer',     name: 'Проверенный оффер',     start: 56000, duration:  7000 },
        { id: 'buyer',     name: 'Покупатель',            start: 63000, duration:  9000 },
        { id: 'exception', name: 'Расхождение',           start: 72000, duration: 11000 },
        { id: 'camera',    name: 'Камера как свидетель',  start: 83000, duration:  7000 },
        { id: 'digest',    name: 'Утренний дайджест',     start: 90000, duration:  7000 },
        { id: 'final',     name: 'Финал',                 start: 97000, duration:  6000 }
      ]);

      const TOTAL = SCENES.reduce((sum, scene) => sum + scene.duration, 0);

      const CUES = Object.freeze([
        { start:     0, end:  4000, text: 'Контроль полки. Проверенные офферы.' },
        { start:  4000, end: 13000, text: 'Вечером полка должна стать фактом.' },
        { start: 13000, end: 22000, text: 'Непосчитанные потери остаются невидимыми.' },
        { start: 22000, end: 27000, text: 'Каталог сопоставляет знакомые строки.' },
        { start: 27000, end: 33000, text: 'Неясная строка ждёт человека.' },
        { start: 33000, end: 40000, text: 'Сначала решение, потом доверие.' },
        { start: 40000, end: 47000, text: 'Пересчёт подтверждает каждую единицу.' },
        { start: 47000, end: 56000, text: 'Сроки превращаются в очередь действий.' },
        { start: 56000, end: 63000, text: 'Только одобренное выходит наружу.' },
        { start: 63000, end: 72000, text: 'Покупатель видит только опубликованный оффер.' },
        { start: 72000, end: 77500, text: 'Расхождение открывает исключение.' },
        { start: 77500, end: 83000, text: 'Без заметки единица не вернётся.' },
        { start: 83000, end: 90000, text: 'Камера замечает. Человек решает.' },
        { start: 90000, end: 97000, text: 'Дайджест содержит только подтверждённые факты.' },
        { start: 97000, end:103000, text: 'Рафли. Полка, которой можно управлять.' }
      ]);

      if (TOTAL !== 103000) throw new Error(`Неверная длина фильма: ${TOTAL}`);
      SCENES.forEach((scene, index) => {
        if (index && scene.start !== SCENES[index - 1].start + SCENES[index - 1].duration) {
          throw new Error(`Разрыв или пересечение перед сценой ${scene.name}`);
        }
      });

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const sceneElements = new Map([...document.querySelectorAll('.scene')].map(node => [node.dataset.scene, node]));
      const startOverlay = document.getElementById('startOverlay');
      const controls = document.getElementById('controls');
      const debugReadout = document.getElementById('debugReadout');
      const playPause = document.getElementById('playPause');
      const scrub = document.getElementById('scrub');
      const panelTime = document.getElementById('panelTime');
      const captionText = document.getElementById('captionText');

      let currentTime = 0;
      let playing = false;
      let started = false;
      let lastNow = performance.now();

      const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
      const easeInOutCubic = value => {
        const t = clamp(value);
        return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      };
      const easeOutQuint = value => 1 - Math.pow(1 - clamp(value), 5);
      const easeOutBackSoft = value => {
        const t = clamp(value);
        const c1 = .72;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      };
      const phase = (p, from, to, curve = easeInOutCubic) => {
        const raw = clamp((p - from) / (to - from));
        return reducedMotion ? (raw > 0 ? 1 : 0) : curve(raw);
      };
      const setOpacity = (id, value) => { document.getElementById(id).style.opacity = String(clamp(value)); };
      const setTransform = (id, value) => { document.getElementById(id).style.transform = value; };
      const mix = (from, to, t) => from + (to - from) * t;

      const CAMERA_BEHAVIORS = Object.freeze({
        title:     { mode: 'static', from: { x:  0, y:  0, s: 1     }, to: { x:  0, y:  0, s: 1     } },
        shop:      { mode: 'push',   from: { x: 14, y: 10, s: 1     }, to: { x: -9, y: -7, s: 1.034 } },
        unknown:   { mode: 'pull',   from: { x:-10, y: -6, s: 1.038 }, to: { x:  8, y:  4, s: 1.008 } },
        import:    { mode: 'drift',  from: { x: 18, y:  0, s: 1.012 }, to: { x:-18, y:  0, s: 1.012 } },
        human:     { mode: 'static', from: { x:  0, y:  0, s: 1     }, to: { x:  0, y:  0, s: 1     } },
        recount:   { mode: 'push',   from: { x:  6, y:  4, s: 1.004 }, to: { x: -7, y: -4, s: 1.027 } },
        expiry:    { mode: 'drift',  from: { x:-16, y:  4, s: 1.014 }, to: { x: 14, y: -3, s: 1.014 } },
        offer:     { mode: 'push',   from: { x: 10, y:  0, s: 1.003 }, to: { x:-11, y: -4, s: 1.022 } },
        buyer:     { mode: 'static', from: { x:  0, y:  0, s: 1     }, to: { x:  0, y:  0, s: 1     } },
        exception: { mode: 'static', from: { x:  0, y:  0, s: 1     }, to: { x:  0, y:  0, s: 1     } },
        camera:    { mode: 'push',   from: { x: 10, y:  4, s: 1.003 }, to: { x:-12, y: -5, s: 1.026 } },
        digest:    { mode: 'pull',   from: { x: -5, y: -5, s: 1.028 }, to: { x:  5, y:  3, s: 1.004 } },
        final:     { mode: 'pull',   from: { x: -7, y: -5, s: 1.045 }, to: { x:  0, y:  0, s: 1     } }
      });

      const TRANSITIONS = Object.freeze({
        title:     { type: 'hard',  duration:   0 },
        shop:      { type: 'ink',   duration: 620 },
        unknown:   { type: 'shelf', duration: 720 },
        import:    { type: 'ink',   duration: 620 },
        human:     { type: 'match', duration: 700 },
        recount:   { type: 'shelf', duration: 720 },
        expiry:    { type: 'match', duration: 700 },
        offer:     { type: 'shelf', duration: 720 },
        buyer:     { type: 'ink',   duration: 620 },
        exception: { type: 'hard',  duration:   0 },
        camera:    { type: 'hard',  duration:   0 },
        digest:    { type: 'ink',   duration: 620 },
        final:     { type: 'match', duration: 700 }
      });

      const LIGHTING = Object.freeze({
        title:     { warm: [0, 0],       cold: [.08, .08], vignette: [.22, .22] },
        shop:      { warm: [.30, .58],   cold: [.04, .08], vignette: [.14, .18] },
        unknown:   { warm: [.20, 0],     cold: [.18, .66], vignette: [.18, .32] },
        import:    { warm: [.05, .08],   cold: [.05, .05], vignette: [.11, .12] },
        human:     { warm: [.12, .12],   cold: [.02, .02], vignette: [.12, .12] },
        recount:   { warm: [.08, .12],   cold: [.02, .02], vignette: [.10, .12] },
        expiry:    { warm: [.18, .34],   cold: [.04, .03], vignette: [.12, .16] },
        offer:     { warm: [.08, .12],   cold: [.02, .02], vignette: [.10, .12] },
        buyer:     { warm: [.03, .03],   cold: [.22, .22], vignette: [.28, .28] },
        exception: { warm: [.05, .05],   cold: [.10, .10], vignette: [.20, .20] },
        camera:    { warm: [.04, .06],   cold: [.26, .32], vignette: [.30, .34] },
        digest:    { warm: [.10, .16],   cold: [.02, .02], vignette: [.10, .11] },
        final:     { warm: [.16, .56],   cold: [.08, .01], vignette: [.16, .12] }
      });
      const formatTime = ms => {
        const safe = Math.max(0, Math.min(TOTAL, ms));
        const minutes = Math.floor(safe / 60000);
        const seconds = Math.floor((safe % 60000) / 1000);
        const millis = Math.floor(safe % 1000);
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(millis).padStart(3, '0')}`;
      };

      function sceneAt(ms) {
        if (ms >= TOTAL) return SCENES[SCENES.length - 1];
        return SCENES.find(scene => ms >= scene.start && ms < scene.start + scene.duration) || SCENES[0];
      }

      function renderTitle(p) {
        const markIn = phase(p, .04, .42, easeOutQuint);
        setOpacity('titleMark', markIn);
        setTransform('titleMark', `translate(770px, 188px) scale(${5.82 + .18 * markIn})`);
        setOpacity('titleMarkDot', phase(p, .20, .40));
        const word = document.getElementById('titleWord');
        const wordIn = phase(p, .30, .56, easeOutQuint);
        word.style.opacity = String(clamp(wordIn));
        word.style.transform = `translate(0px, ${18 * (1 - wordIn)}px)`;
      }

      function renderShop(p) {
        document.getElementById('shopUnits').style.opacity = String(.4 + .6 * phase(p, .22, .58));
      }

      function renderUnknown(p) {
        const veil = phase(p, .10, .62);
        document.getElementById('unknownUnits').style.opacity = String(.9 - .48 * veil);
        document.getElementById('questionMarks').style.opacity = String(phase(p, .18, .44));
        document.getElementById('fog').style.opacity = String(.05 + .22 * veil);
      }

      function renderImport(p) {
        const lines = [...document.querySelectorAll('#matchLines path')];
        lines.forEach((line, index) => {
          const lineP = phase(p, .05 + index * .09, .28 + index * .09);
          line.style.opacity = String(index === 2 ? phase(p, .42, .56) : lineP);
          line.style.transform = `translate(0px, ${10 * (1 - lineP)}px)`;
        });
        document.getElementById('ambiguousRow').style.opacity = String(.72 + .28 * phase(p, .42, .58));
      }

      function renderHuman(p) {
        const decide = phase(p, .30, .58, easeOutBackSoft);
        setTransform('humanHand', `translate(${-280 - 26 * decide}px, ${18 - 14 * decide}px)`);
        setOpacity('humanChoiceSelected', phase(p, .56, .66, easeOutQuint));
        const tickIn = phase(p, .60, .74, easeOutQuint);
        setOpacity('humanTick', tickIn);
        setTransform('humanTick', `translate(0px, ${12 * (1 - tickIn)}px)`);
      }

      function renderRecount(p) {
        const count = Math.min(6, Math.floor(phase(p, .08, .72) * 6.999));
        [...document.querySelectorAll('.recount-number')].forEach((node, index) => {
          node.style.opacity = String(index === count ? 1 : 0);
        });
        [...document.querySelectorAll('.unitTick')].forEach((node, index) => {
          node.style.opacity = String(count > index ? 1 : 0);
        });
        const confidence = .095 + .905 * phase(p, .12, .78, easeOutQuint);
        setTransform('confidenceBar', `scaleX(${confidence})`);
        const unlock = phase(p, .58, .72, easeOutBackSoft);
        setOpacity('ceilingUnlock', unlock);
        setTransform('ceilingUnlock', `translate(0px, ${372 + 14 * (1 - unlock)}px)`);
      }

      function renderExpiry(p) {
        const baseY = [76, 82, 69, 78];
        [...document.querySelectorAll('.expiryUnit')].forEach((node, index) => {
          const arrival = phase(p, .05 + index * .07, .25 + index * .07, easeOutBackSoft);
          node.style.opacity = String(.28 + .72 * arrival);
          const lift = 26 * (1 - arrival);
          const positions = [72, 308, 544, 780];
          node.style.transform = `translate(${positions[index]}px, ${baseY[index] + lift}px)`;
        });
        const arrowIn = phase(p, .28, .58, easeOutQuint);
        setOpacity('sortArrow', arrowIn);
        setTransform('sortArrow', `translate(${-26 * (1 - arrowIn)}px, 0px)`);
      }

      function renderOffer(p) {
        const click = phase(p, .12, .34, easeOutBackSoft);
        setTransform('managerCursor', `translate(${720 - 110 * click}px, ${590 - 18 * click}px)`);
        const travel = phase(p, .35, .82, easeOutBackSoft);
        const x = 185 + (1190 - 185) * travel;
        const y = 230 + (300 - 230) * travel;
        const card = document.getElementById('offerCard');
        card.style.transform = `translate(${x}px, ${y}px)`;
        card.style.opacity = String(phase(p, .35, .43));
      }

      function renderBuyer(p) {
        const tap = phase(p, .28, .48, easeOutBackSoft);
        const tapNode = document.getElementById('buyerTap');
        tapNode.style.opacity = String(1 - phase(p, .47, .58));
        tapNode.style.transform = `translate(${1180 - 270 * tap}px, ${760 - 10 * tap}px) scale(${1 - .28 * tap})`;
        const code = phase(p, .58, .68);
        setOpacity('pickupCode', code);
        setOpacity('reserveButton', 1 - code);
      }

      function renderException(p) {
        const note = phase(p, .35, .46, easeOutQuint);
        setOpacity('exceptionNote', note);
        setTransform('exceptionNote', `translate(0px, ${8 * (1 - note)}px)`);
        const decide = phase(p, .54, .70, easeOutBackSoft);
        setTransform('exceptionHand', `translate(${1310 - 32 * decide}px, ${695 - 21 * decide}px)`);
        document.getElementById('closeException').style.opacity = String(.48 + .52 * phase(p, .62, .72));
        setOpacity('exceptionLock', 1 - phase(p, .80, .88));
        const returned = phase(p, .82, .96, easeOutBackSoft);
        const x = 610 + (350 - 610) * returned;
        const y = 720 + (325 - 720) * returned;
        const unit = document.getElementById('returnedUnit');
        unit.style.transform = `translate(${x}px, ${y}px)`;
        unit.style.opacity = String(returned);
      }

      function renderCamera(p) {
        const frame = document.getElementById('cameraFrame');
        frame.style.opacity = String(phase(p, .12, .32));
        const flag = phase(p, .35, .48, easeOutQuint);
        setOpacity('cameraFlag', flag);
        setTransform('cameraFlag', `translate(778px, ${266 + 10 * (1 - flag)}px)`);
        const decision = document.getElementById('cameraDecision');
        const decisionIn = phase(p, .60, .72, easeOutQuint);
        decision.style.opacity = String(.45 + .55 * decisionIn);
        decision.style.transform = `translate(52px, ${330 + 10 * (1 - decisionIn)}px)`;
      }

      function renderDigest(p) {
        [...document.querySelectorAll('.digestRow use')].forEach((node, index) => {
          node.style.opacity = String(.18 + .82 * phase(p, .06 + index * .10, .23 + index * .10));
        });
        const phone = document.getElementById('digestPhone');
        const settle = phase(p, .02, .32, easeOutBackSoft);
        phone.style.transform = `translate(600px, ${90 + 38 * (1 - settle)}px)`;
      }

      function renderFinal(p) {
        const brand = document.getElementById('finalBrand');
        const brandIn = phase(p, .28, .54, easeOutQuint);
        brand.style.opacity = String(brandIn);
        brand.style.transform = `translate(610px, ${805 + 18 * (1 - brandIn)}px)`;
      }

      const RENDERERS = {
        title: renderTitle,
        shop: renderShop,
        unknown: renderUnknown,
        import: renderImport,
        human: renderHuman,
        recount: renderRecount,
        expiry: renderExpiry,
        offer: renderOffer,
        buyer: renderBuyer,
        exception: renderException,
        camera: renderCamera,
        digest: renderDigest,
        final: renderFinal
      };

      function renderCameraRig(scene, p) {
        const behavior = CAMERA_BEHAVIORS[scene.id];
        const moving = behavior.mode !== 'static' && !reducedMotion;
        const t = moving ? phase(p, .03, .97, easeInOutCubic) : 0;
        const x = moving ? mix(behavior.from.x, behavior.to.x, t) : 0;
        const y = moving ? mix(behavior.from.y, behavior.to.y, t) : 0;
        const scale = moving ? mix(behavior.from.s, behavior.to.s, t) : 1;
        const tx = 960 * (1 - scale) + x;
        const ty = 461 * (1 - scale) + y;
        setTransform('cameraStage', `translate(${tx}px, ${ty}px) scale(${scale})`);
        return { x, y, scale, t };
      }

      function renderDepth(scene, p, camera) {
        const root = sceneElements.get(scene.id);
        const intro = reducedMotion ? 1 : phase(p, .01, .10, easeOutQuint);
        const zoomShift = (camera.scale - 1) * 140;
        const layers = [
          ['.depth-bg', -.24, -.18],
          ['.depth-mid', -.09, -.06],
          ['.depth-subject', .07, .05]
        ];
        layers.forEach(([selector, xRate, yRate], index) => {
          const node = root.querySelector(selector);
          if (!node) return;
          const x = reducedMotion ? 0 : -camera.x * xRate + zoomShift * xRate;
          const y = reducedMotion ? 0 : -camera.y * yRate + zoomShift * yRate + (index === 2 ? 10 * (1 - intro) : 0);
          node.style.transform = `translate(${x}px, ${y}px)`;
          node.style.opacity = String(index === 2 ? clamp(.72 + .28 * intro) : 1);
        });
        const kicker = root.querySelector('.scene-kicker');
        if (kicker) {
          const reveal = reducedMotion ? 1 : phase(p, .02, .15, easeOutQuint);
          kicker.style.opacity = String(reveal);
          kicker.style.transform = `translate(0px, ${9 * (1 - reveal)}px)`;
        }
      }

      function renderLighting(scene, p) {
        const light = LIGHTING[scene.id];
        const t = reducedMotion ? 1 : phase(p, .04, .94, easeInOutCubic);
        setOpacity('warmLight', mix(light.warm[0], light.warm[1], t));
        setOpacity('coldLight', mix(light.cold[0], light.cold[1], t));
        setOpacity('vignetteLight', mix(light.vignette[0], light.vignette[1], t));
        setTransform('warmLight', `translate(${12 * t}px, ${-5 * t}px)`);
        setTransform('coldLight', 'translate(0px, 0px)');
      }

      function clearTransitionLayers() {
        setOpacity('inkTransition', 0);
        setOpacity('shelfTransition', 0);
        setOpacity('matchTransition', 0);
      }

      function setSceneOpacity(id, value) {
        const node = sceneElements.get(id);
        node.classList.toggle('active', value > 0);
        node.style.opacity = String(clamp(value));
      }

      function renderTransition(ms, scene, local) {
        sceneElements.forEach((node, id) => setSceneOpacity(id, id === scene.id ? 1 : 0));
        clearTransitionLayers();
        const transition = TRANSITIONS[scene.id];
        const sceneIndex = SCENES.findIndex(item => item.id === scene.id);
        const elapsed = ms - scene.start;
        if (reducedMotion || transition.type === 'hard' || !sceneIndex || elapsed >= transition.duration) return;

        const previous = SCENES[sceneIndex - 1];
        const raw = clamp(elapsed / transition.duration);
        const eased = easeInOutCubic(raw);
        RENDERERS[previous.id](1);
        renderDepth(previous, 1, { x: 0, y: 0, scale: 1, t: 1 });

        if (transition.type === 'ink') {
          const cover = raw < .5 ? easeOutQuint(raw * 2) : 1 - easeOutQuint((raw - .5) * 2);
          setSceneOpacity(previous.id, raw < .53 ? 1 : 0);
          setSceneOpacity(scene.id, raw < .47 ? 0 : 1);
          setOpacity('inkTransition', cover);
          return;
        }

        setSceneOpacity(previous.id, 1 - eased);
        setSceneOpacity(scene.id, eased);
        if (transition.type === 'shelf') {
          setOpacity('shelfTransition', Math.sin(raw * Math.PI));
          setTransform('shelfTransition', `translate(${4020 * raw}px, 0px)`);
        } else if (transition.type === 'match') {
          setOpacity('matchTransition', Math.sin(raw * Math.PI));
          const travel = easeOutBackSoft(raw);
          setTransform('matchTransition', `translate(${360 + 1200 * travel}px, ${-18 * Math.sin(raw * Math.PI)}px) scale(${.78 + .22 * eased})`);
        }
      }

      function renderCaption(ms) {
        const cue = ms >= TOTAL ? CUES[CUES.length - 1] : CUES.find(item => ms >= item.start && ms < item.end);
        captionText.textContent = cue ? cue.text : '';
        if (!cue) return;
        const elapsed = ms - cue.start;
        const remaining = cue.end - ms;
        const inOpacity = reducedMotion ? 1 : easeOutQuint(clamp(elapsed / 260));
        const outOpacity = reducedMotion ? 1 : easeInOutCubic(clamp(remaining / 220));
        const opacity = Math.min(inOpacity, outOpacity);
        captionText.style.opacity = String(opacity);
        captionText.style.transform = `translate(0px, ${8 * (1 - inOpacity)}px)`;
      }

      function render(ms) {
        const scene = sceneAt(ms);
        const local = clamp((ms - scene.start) / scene.duration);
        RENDERERS[scene.id](local);
        const camera = renderCameraRig(scene, local);
        renderDepth(scene, local, camera);
        renderLighting(scene, local);
        renderTransition(ms, scene, local);
        renderCaption(ms);
        scrub.value = String(Math.round(ms));
        panelTime.textContent = formatTime(ms);
        playPause.textContent = playing ? 'Пауза' : 'Играть';
        if (debugReadout.classList.contains('visible')) {
          debugReadout.textContent = `${formatTime(ms)} / ${formatTime(TOTAL)}\n${scene.name}`;
        }
      }

      function tick(now) {
        const delta = Math.min(100, Math.max(0, now - lastNow));
        lastNow = now;
        if (playing) {
          currentTime = Math.min(TOTAL, currentTime + delta);
          if (currentTime >= TOTAL) playing = false;
        }
        render(currentTime);
        requestAnimationFrame(tick);
      }

      function begin() {
        started = true;
        startOverlay.classList.add('hidden');
        if (currentTime >= TOTAL) currentTime = 0;
        playing = true;
        lastNow = performance.now();
      }

      function togglePlay() {
        if (!started) return;
        if (currentTime >= TOTAL) currentTime = 0;
        playing = !playing;
        lastNow = performance.now();
      }

      function restartFilm() {
        if (!started) return;
        currentTime = 0;
        playing = true;
        lastNow = performance.now();
        render(currentTime);
      }

      function stepScene(direction) {
        if (!started) return;
        const current = sceneAt(currentTime);
        const index = SCENES.findIndex(scene => scene.id === current.id);
        const target = SCENES[clamp(index + direction, 0, SCENES.length - 1)];
        currentTime = target.start;
        playing = false;
        render(currentTime);
      }

      function resizeStage() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        const stage = document.getElementById('stage');
        const left = (window.innerWidth - 1920 * scale) / 2;
        const top = (window.innerHeight - 1080 * scale) / 2;
        stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
      }

      function validateCopy() {
        const errors = [];
        const check = (text, holdMs, source) => {
          const words = text.trim().split(/\s+/u).filter(Boolean).length;
          const requiredMs = 1600 + 60 * [...text].length;
          if (words > 9) errors.push(`${source}: ${words} слов`);
          if (holdMs < requiredMs) errors.push(`${source}: ${holdMs} мс меньше ${requiredMs} мс`);
        };
        CUES.forEach((cue, index) => check(cue.text, cue.end - cue.start, `Титр ${index + 1}`));
        document.querySelectorAll('.scene text').forEach(node => {
          const text = node.textContent.trim();
          if (!text) return;
          const sceneNode = node.closest('.scene');
          const scene = SCENES.find(item => item.id === sceneNode.dataset.scene);
          const timed = node.closest('[data-hold-ms]');
          const holdMs = timed ? Number(timed.dataset.holdMs) : scene.duration;
          check(text, holdMs, `${scene.name}: «${text}»`);
        });
        if (errors.length) throw new Error(`Ошибка длительности текста:\n${errors.join('\n')}`);
      }

      function validateFilmStructure() {
        const errors = [];
        if (SCENES[SCENES.length - 1].start + SCENES[SCENES.length - 1].duration !== TOTAL) {
          errors.push('Финальная сцена не заканчивается на общей длительности');
        }
        SCENES.forEach(scene => {
          const node = sceneElements.get(scene.id);
          if (!node) errors.push(`Нет SVG-сцены ${scene.id}`);
          if (!CAMERA_BEHAVIORS[scene.id]) errors.push(`Нет камеры для ${scene.id}`);
          if (!TRANSITIONS[scene.id]) errors.push(`Нет перехода для ${scene.id}`);
          if (!LIGHTING[scene.id]) errors.push(`Нет света для ${scene.id}`);
          if (node && ['depth-bg', 'depth-mid', 'depth-subject'].some(name => !node.querySelector(`.${name}`))) {
            errors.push(`Нет трёх планов в ${scene.id}`);
          }
        });
        const staticCameras = Object.values(CAMERA_BEHAVIORS).filter(item => item.mode === 'static').length;
        if (staticCameras < 3) errors.push(`Нужно минимум три статичные камеры, найдено ${staticCameras}`);
        ['exception', 'camera'].forEach(id => {
          if (TRANSITIONS[id].type !== 'hard') errors.push(`Вход в ${id} должен быть резкой склейкой`);
        });
        CUES.forEach((cue, index) => {
          if (index && cue.start !== CUES[index - 1].end) errors.push(`Разрыв титров перед ${index + 1}`);
        });
        const remoteReferences = [...document.querySelectorAll('[src], [href]')].filter(node => {
          const value = node.getAttribute('src') || node.getAttribute('href') || '';
          return value && !value.startsWith('#');
        });
        if (remoteReferences.length) errors.push('Найдена внешняя ссылка');
        if (errors.length) throw new Error(`Ошибка структуры фильма:\n${errors.join('\n')}`);
      }

      document.getElementById('startButton').addEventListener('click', begin);
      playPause.addEventListener('click', togglePlay);
      document.getElementById('restart').addEventListener('click', restartFilm);
      scrub.addEventListener('input', event => {
        if (!started) return;
        currentTime = Number(event.target.value);
        render(currentTime);
      });
      window.addEventListener('resize', resizeStage);
      window.addEventListener('keydown', event => {
        if (event.key.toLowerCase() === 'k') {
          controls.classList.toggle('visible');
          return;
        }
        if (!started) return;
        if (event.code === 'Space') {
          event.preventDefault();
          togglePlay();
        } else if (event.key.toLowerCase() === 'r') {
          restartFilm();
        } else if (event.key === '.') {
          stepScene(1);
        } else if (event.key === ',') {
          stepScene(-1);
        }
      });

      if (new URLSearchParams(window.location.search).has('debug')) debugReadout.classList.add('visible');
      window.__RAFLY_FILM__ = Object.freeze({
        SCENES,
        CUES,
        TOTAL,
        CAMERA_BEHAVIORS,
        TRANSITIONS,
        LIGHTING,
        reducedMotion
      });
      validateFilmStructure();
      validateCopy();
      resizeStage();
      render(0);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
